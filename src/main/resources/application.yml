# Nombre de la aplicacion
spring:
  application:
    name: restaurant-api

# Configuracion de PostgreSQL
# Las credenciales se resuelven desde variables de entorno.
# DB_USERNAME y DB_PASSWORD son obligatorias: si faltan o estan vacias,
# la aplicacion no arranca (validacion explicita al inicio).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# Configuracion de Hibernate
  jpa:
    hibernate:
      # Durante desarrollo:
      # ddl-auto: create (para regenerar datos de ejemplo)
      #
      # Para uso normal:
        ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Puerto del servidor
server:
  port: 8080

# Configuracion JWT
# JWT_SECRET es obligatoria y debe tener al menos 32 bytes (256 bits) para HS256.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# Configuracion de Firebase Admin
# Desactivado por defecto: el backend arranca sin credenciales de Firebase y
# el login legado (/auth/login) no se ve afectado.
# Las credenciales se resuelven con Google Application Default Credentials
# (GOOGLE_APPLICATION_CREDENTIALS), siempre fuera del repositorio y de la app.
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:flutter-spring-test-73f45}
  allowed-domain: ${FIREBASE_ALLOWED_DOMAIN:tecdesoftware.edu.mx}
  require-verified-email: ${FIREBASE_REQUIRE_VERIFIED_EMAIL:true}
